# Nginx reverse proxy config for SmartHubOS Grafana
# HTTP-only to start — certbot --nginx adds the SSL server block automatically.
# Do not add ssl_certificate lines manually; certbot manages them.

server {
    listen 80;
    server_name GRAFANA_DOMAIN_PLACEHOLDER;

    # ACME challenge (used by certbot for domain validation)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy to Grafana (certbot will move this to the HTTPS block after cert issuance)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket support (Grafana Live)
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
